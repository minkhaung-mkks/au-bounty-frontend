# Nginx config served as /etc/nginx/conf.d/default.conf. The file lives at
# http-context level, so the map belongs here, above the server block.
#
# The bundle is mounted under /aubounty/ (matching the vite base and the router
# basename), the same prefix the shared-domain gateway forwards verbatim.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Files live in the aubounty/ subdir; URIs already carry the /aubounty/
  # prefix, so root + $uri lines up without a rewrite.
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build output: content-addressed, safe to cache forever.
  location /aubounty/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # REST API. The api keeps its deployed prefix (/aubounty/api), so the
  # proxy_pass URI mirrors the location and the prefix survives intact.
  location /aubounty/api/ {
    proxy_pass http://api:4000/aubounty/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Attachment uploads (backend caps each file at MAX_UPLOAD_MB); leave
    # headroom for multipart overhead and multi-file payloads.
    client_max_body_size 64m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Realtime: socket.io with websocket transport plus long-polling fallback.
  # Both must work, so the Upgrade/Connection pair is derived from the request
  # and the read timeout is long enough for an idle websocket to survive.
  location /aubounty/socket.io/ {
    proxy_pass http://api:4000/aubounty/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Polling responses must reach the client unbuffered and whole.
    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
  }

  # SPA with history routing under the /aubounty/ mount: real files if they
  # exist, the app otherwise.
  location /aubounty/ {
    try_files $uri /aubounty/index.html;
  }

  # The shell is always revalidated so deploys surface immediately.
  location = /aubounty/index.html {
    add_header Cache-Control "no-cache";
  }

  # The container serves nothing outside the mount; send stray hits there.
  location / {
    return 302 /aubounty/;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/x-javascript
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
}
